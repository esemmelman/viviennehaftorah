<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead6">
  <meta name="description" content="An interactive trainer for Isaiah 49:14–17.">
  <title>Isaiah 49:14–17 · Haftarah Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.1">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">יְשַׁעְיָהוּ · ISAIAH</p>
      <h1>Chapter 49, verses 14–17</h1>
      <div class="display-controls" aria-label="Display and audio options">
        <label class="audio-toggle" for="audio-toggle">
          <span>Audio</span>
          <input id="audio-toggle" type="checkbox" checked>
          <span class="audio-toggle-track" aria-hidden="true"></span>
        </label>
        <span class="display-controls-spacer" aria-hidden="true"></span>
        <button class="display-toggle recording-repair" id="record-missing-button" type="button" hidden>Record missing audio</button>
        <button class="display-toggle recording-repair" id="rerecord-button" type="button" hidden>Re-record phrase</button>
        <button class="display-toggle active" id="trope-toggle" type="button" aria-pressed="true">Trope</button>
      </div>
    </header>

    <section class="passage-card" id="passage" aria-label="Isaiah chapter 49, verses 14 through 17"></section>
    <p class="status" id="status" aria-live="polite">Hover over a highlighted phrase to hear it, or select a verse number.</p>
    <p class="privacy">Shared phrase recordings saved with Supabase.</p>
    <p class="version">Version 1.0.1</p>
  </main>

  <dialog id="recorder-dialog">
    <form method="dialog">
      <p class="dialog-label" id="recorder-label">Phrase</p>
      <p class="dialog-phrase" id="recorder-phrase" dir="rtl" lang="he"></p>
      <div class="dialog-actions">
        <button id="record-button" type="button">● Record</button>
        <button id="play-button" type="button">▶ Play</button>
        <button id="delete-recording-button" type="button" hidden>Delete recording</button>
        <button value="close">Done</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=1.0.1"></script>
</body>
</html>
